<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ECHO independent range readout</title>
<style>body{font:16px system-ui;background:#101820;color:#e5f4ff;max-width:960px;margin:3rem auto;padding:1rem}input{width:28rem;max-width:90%;padding:.6rem}button{padding:.6rem}article{border:1px solid #456;padding:1rem;margin:1rem 0}strong{font-size:2rem}small{color:#bcd}</style>
<h1>ECHO ? independent range readout</h1><p>Distance only. No measured 3D endpoint, calibrated fusion, safety or searched-area claim.</p><p><small>Keep the existing LiDAR viewer open independently. SYNTHETIC and REPLAY labels are preserved.</small></p>
<label>Range viewer URL <input id="url" value="ws://127.0.0.1:8765/range/view"></label><button id="connect">Connect</button><button id="disconnect">Disconnect</button><main id="panel"></main>
<script type="module">import{mountRangePanel}from'/src/range.js';let panel;document.querySelector('#connect').onclick=()=>{panel?.disconnect();panel=mountRangePanel(document.querySelector('#panel'),{url:document.querySelector('#url').value});try{panel.connect()}catch(error){document.querySelector('#panel').textContent=error.message}};document.querySelector('#disconnect').onclick=()=>panel?.disconnect();</script></html>
