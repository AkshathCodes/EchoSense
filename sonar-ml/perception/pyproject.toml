[build-system]
requires = ["setuptools>=64"]  # >=64 for editable installs (Databricks pipeline env)
build-backend = "setuptools.build_meta"

[project]
name = "sonar-perception"
version = "0.1.0"
description = "Simulation, 3D mapping, segmentation and classification for in-air sonar (MadHacks firefighter project)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
torch = ["torch>=2.1"]
# Lakehouse adapters + Databricks job code (sonar-ml/databricks/, ADR-0014). Databricks runtimes already have these.
lakehouse = ["pandas>=2", "pyarrow>=14"]
# Only to run the local Spark smoke test (tests/test_lakehouse_spark.py); needs Java 17+.
spark = ["pyspark>=3.5", "pandas>=2", "pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
