resources:
  pipelines:
    sonar_pipeline:
      name: echosense-sonar-lakehouse
      catalog: ${var.catalog}
      schema: ${resources.schemas.sonar.name}
      serverless: true
      channel: CURRENT
      continuous: false
      libraries:
        - file:
            path: ../pipeline/sonar_pipeline.py
      environment:
        dependencies:
          # The wheel the bundle builds and uploads (artifacts.sonar_perception). An editable
          # install of ${workspace.file_path}/perception did NOT work: the pipeline ran with
          # "No module named sonar_perception" (log 2026-11-14 session 6). Bump the file name
          # here if perception/pyproject.toml's version changes.
          - ${workspace.artifact_path}/.internal/sonar_perception-0.1.0-py3-none-any.whl
      configuration:
        sonar.catalog: ${var.catalog}
        sonar.schema: ${resources.schemas.sonar.name}
        sonar.landing_path: /Volumes/${var.catalog}/${resources.schemas.sonar.name}/landing
        # Each frame row carries thousands of points; keep Arrow batches small for the pandas UDFs.
        spark.sql.execution.arrow.maxRecordsPerBatch: "32"
