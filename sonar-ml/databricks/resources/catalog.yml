resources:
  schemas:
    sonar:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: EchoSense sonar lakehouse (sonar-ml/databricks, ADR-0014)

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.sonar.name}
      name: landing
      volume_type: MANAGED
      comment: Drop zone. frames/ for SonarFrame .npz files (recorded or live captures), acoustic/ for acoustic/ scan CSVs.

  experiments:
    sonar_experiment:
      name: ${workspace.root_path}/sonar-classifier

  registered_models:
    classifier:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.sonar.name}
      name: sonar_cluster_classifier
      comment: Random forest on 26 cluster features with person bias (ADR-0011, ADR-0012). Alias "champion" = model used for scoring.
