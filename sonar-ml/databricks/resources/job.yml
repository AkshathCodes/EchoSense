resources:
  jobs:
    sonar_lakehouse:
      name: echosense-sonar-lakehouse
      description: >
        Simulate sonar scenes in parallel -> refresh the bronze/silver/gold pipeline ->
        train + register the classifier in MLflow -> score frames into gold detection tables.
        Every task tags its rows with run_id = run<job run id>.

      parameters:
        - name: n_scenes
          default: "2000"
        - name: seed
          default: "0"           # change per run, or runs repeat the same scenes
        - name: env_mode
          default: random        # random | clear | fog | warm | heavy | extreme
        - name: pings
          default: "4"           # recommended (ADR-0013)
        - name: sweep
          default: "1"
        - name: min_views
          default: "1"
        - name: tilt
          default: "0"
        - name: person_bias
          default: "2"           # recommended (ADR-0012)
        - name: partitions
          default: "64"

      environments:
        - environment_key: sonar
          spec:
            environment_version: "3"
            dependencies:
              - ../../perception/dist/*.whl
              - mlflow>=2.16

      tasks:
        - task_key: generate
          environment_key: sonar
          spark_python_task:
            python_file: ../jobs/generate.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.sonar.name}
              - --run-id=run{{job.run_id}}
              - --n-scenes={{job.parameters.n_scenes}}
              - --seed={{job.parameters.seed}}
              - --env-mode={{job.parameters.env_mode}}
              - --pings={{job.parameters.pings}}
              - --sweep={{job.parameters.sweep}}
              - --min-views={{job.parameters.min_views}}
              - --tilt={{job.parameters.tilt}}
              - --partitions={{job.parameters.partitions}}

        - task_key: refresh_pipeline
          depends_on:
            - task_key: generate
          pipeline_task:
            pipeline_id: ${resources.pipelines.sonar_pipeline.id}

        - task_key: train
          depends_on:
            - task_key: refresh_pipeline
          environment_key: sonar
          spark_python_task:
            python_file: ../jobs/train.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.sonar.name}
              - --run-id=run{{job.run_id}}
              - --seed={{job.parameters.seed}}
              - --person-bias={{job.parameters.person_bias}}
              - --experiment=${resources.experiments.sonar_experiment.name}
              - --model-name=${var.catalog}.${resources.schemas.sonar.name}.${resources.registered_models.classifier.name}

        - task_key: score
          depends_on:
            - task_key: train
          environment_key: sonar
          spark_python_task:
            python_file: ../jobs/score.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.sonar.name}
              - --run-id=run{{job.run_id}}
              - --model-name=${var.catalog}.${resources.schemas.sonar.name}.${resources.registered_models.classifier.name}
