# Databricks Asset Bundle for the EchoSense sonar lakehouse (ADR-0014).
# Docs: databricks/README.md. Deploy from sonar-ml/:
#   databricks bundle validate && databricks bundle deploy && databricks bundle run sonar_lakehouse
bundle:
  name: echosense_sonar

include:
  - databricks/resources/*.yml

artifacts:
  # The perception package, built as a wheel and installed on job compute
  # (driver + executors), so Spark UDFs can import sonar_perception.
  sonar_perception:
    type: whl
    path: ./perception
    build: python3 -m pip wheel --no-deps --wheel-dir dist .

variables:
  catalog:
    description: Unity Catalog catalog. Free Edition workspaces ship with "workspace".
    default: workspace
  schema:
    description: Schema for every sonar table, the landing volume, and the model.
    default: echosense_sonar

targets:
  dev:
    # Development mode prefixes resource names with your user, so teammates
    # deploying to one workspace don't collide.
    mode: development
    default: true
