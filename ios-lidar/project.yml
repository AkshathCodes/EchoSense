# Fallback only. The committed EchoSenseLiDAR.xcodeproj should open as is in Xcode 16+.
# If it does not: brew install xcodegen && xcodegen generate (run in this folder).
name: EchoSenseLiDAR
options:
  bundleIdPrefix: io.madhacks.echosense
  deploymentTarget:
    iOS: "16.0"
targets:
  EchoSenseLiDAR:
    type: application
    platform: iOS
    sources: [EchoSenseLiDAR]
    info:
      path: Info.generated.plist
      properties:
        CFBundleDisplayName: EchoSense
        NSCameraUsageDescription: EchoSense uses the camera and LiDAR scanner to measure the room around you.
        NSLocalNetworkUsageDescription: EchoSense sends the scan to the viewer running on your laptop.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.madhacks.echosense.lidar
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
