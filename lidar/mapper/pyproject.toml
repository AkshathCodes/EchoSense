[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-mapper"
version = "0.1.0"
description = "EchoSense: dark-safe live 3D mapping from iPhone LiDAR depth + IMU (no camera)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "websockets>=12", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7"]
sonar = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lidar_mapper = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
